[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numpyai-dashboard"
version = "0.1.0"
description = "Load spreadsheets into NumPy and explore them in natural language."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Aadya Chinubhai", email = "aadyachinubhai@gmail.com" }]
requires-python = ">=3.11"
keywords = ["numpy", "llm", "ai", "data-analysis", "excel", "spreadsheet", "dashboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26",
    "rich>=13.7",
    "pydantic>=2.6",
    "pydantic-ai>=0.0.13",
]

[project.optional-dependencies]
google = ["pydantic-ai-slim[google]>=0.0.13"]
openai = ["pydantic-ai-slim[openai]>=0.0.13"]
anthropic = ["pydantic-ai-slim[anthropic]>=0.0.13"]
excel = ["fastexcel[pandas]>=0.20"]
csv = ["pandas>=2.0"]
ui = ["panel>=1.5", "fastexcel[pandas]>=0.20"]
extras = ["matplotlib>=3.8", "scikit-learn>=1.4", "scipy>=1.11"]
all = [
    "pydantic-ai[all]>=0.0.13",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "fastexcel[pandas]>=0.20",
    "pandas>=2.0",
]
dev = [
    "fastexcel[pandas]>=0.20",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "python-dotenv>=1.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.5",
    "sphinx>=7.0",
]

[project.urls]
Homepage = "https://github.com/aadya940/numpyai-dashboard"
Issues = "https://github.com/aadya940/numpyai-dashboard/issues"
"Upstream (numpyai)" = "https://github.com/aadya940/numpyai"

[tool.setuptools.packages.find]
include = ["numpyai_dashboard*"]
exclude = ["examples*", "source*", "tests*"]

[tool.setuptools.package-data]
numpyai_dashboard = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
